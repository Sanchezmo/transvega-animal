[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Depends in argument defaults - FastAPI pattern
    "DTZ003", # datetime.utcnow() - extensive changes needed
    "DTZ005", # datetime.now() without tz - extensive changes needed
    "DTZ006", # fromtimestamp without tz
    "DTZ007", # strptime without %z
    "DTZ011", # date.today()
    "B904",   # raise from err - extensive changes needed
    "E402",   # Module level import not at top of file - test files have sys.path.insert before imports
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "agents",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Ignore import-untyped for internal modules that don't have py.typed markers
ignore_missing_imports = true

# Exclude directories with pre-existing MyPy errors not in current scope
exclude = [
    "services/integration-api/app/adapters/advertising-platforms",
    "services/integration-api/app/adapters/cloudflare",
    "services/integration-api/app/adapters/google-workspace",
    "services/integration-api/app/adapters/verifactu",
    "services/integration-api/app/adapters/dolibarr/mappers.py",
    "services/integration-api/app/adapters/dolibarr/mock.py",
    "services/integration-api/app/adapters/dolibarr/client.py",
    "services/integration-api/app/routes",
    "services/integration-api/app/dependencies",
    "services/integration-api/app/services/publication_service.py",
    "services/integration-api/app/services/invoice_draft_service.py",
    "services/integration-api/app/services/invoice_audit_service.py",
    "services/integration-api/app/services/expense_category_service.py",
    "services/integration-api/app/services/conversation_manager.py",
    "services/integration-api/app/main.py",
    "services/integration-api/app/models.py",
    "services/integration-api/app/schemas/conversation.py",
    "services/integration-api/app/services/invoice_draft_service.py",
    "services/integration-api/app/services/invoice_audit_service.py",
    "services/integration-api/app/services/expense_category_service.py",
    "services/integration-api/app/services/conversation_manager.py",
    "services/integration-api/app/core/telegram_client.py",
    "test_publishing_simple.py",
    "test_dog_schemas_standalone.py",
    "test_media_selection.py",
    "tests/integration/test_telegram_dog_intake.py",
    "tests/integration/test_telegram_outbound.py",
    "tests/integration/test_api.py",
    "tests/unit/test_schemas.py",
    "skills/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
