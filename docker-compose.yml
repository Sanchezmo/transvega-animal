# docker-compose.yml - Orquestador principal que delega a los archivos de entorno
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#      docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

# Este archivo define solo la configuración común base
# Los servicios reales están en docker-compose.dev.yml, docker-compose.staging.yml, docker-compose.prod.yml

services:
  # Placeholder - los servicios reales se definen en los archivos de entorno
  # docker-compose no soporta "extends" en v3.8 para servicios completos
  # Mantenemos este archivo para compatibilidad con herramientas que esperan docker-compose.yml

networks:
  transvega-frontend:
    external: true
  transvega-backend:
    external: true
  transvega-monitoring:
    external: true

volumes:
  audit-db-data:
    external: true
  redis-data:
    external: true
  prometheus-data:
    external: true
  grafana-data:
    external: true
  loki-data:
    external: true
  alertmanager-data:
    external: true
  ollama-data:
    external: true