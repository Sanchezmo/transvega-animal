[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Depends in argument defaults - FastAPI pattern
    "DTZ003", # datetime.utcnow() - extensive changes needed
    "DTZ005", # datetime.now() without tz - extensive changes needed
    "DTZ006", # fromtimestamp without tz
    "DTZ007", # strptime without %z
    "DTZ011", # date.today()
    "B904",   # raise from err - extensive changes needed
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "agents",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "__pycache__"]
skip = ["B104"]