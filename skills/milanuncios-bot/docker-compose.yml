# Milanuncios Bot - Docker Compose
version: '3.8'

services:
  milanuncios-bot:
    build: .
    container_name: milanuncios-bot
    environment:
      - MILANUNCIOS_EMAIL=${MILANUNCIOS_EMAIL}
      - MILANUNCIOS_PASSWORD=${MILANUNCIOS_PASSWORD}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - HEADLESS=true
      - RENEWAL_DELAY_MIN=120
      - RENEWAL_DELAY_MAX=300
      - MAX_ADS_PER_RUN=50
      - SCHEDULE_HOUR=6
      - SCHEDULE_MINUTE=0
      - LOG_LEVEL=INFO
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: milanuncios-network