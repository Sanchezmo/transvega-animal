version: '3.8'

services:
  # =============================================================================
  # BASE DE DATOS AUDITORÍA (PostgreSQL - Solo red interna + puerto opcional para debugging)
  # =============================================================================
  audit-db:
    image: postgres:16-alpine
    container_name: transvega-audit-db-staging
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - audit-db-data-staging:/var/lib/postgresql/data
      - ./infrastructure/docker/init-audit-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"  # Puerto diferente para no colisionar con dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # REDIS (Solo red interna + puerto opcional para debugging)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: transvega-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-staging:/data
    ports:
      - "127.0.0.1:6380:6379"  # Puerto diferente para no colisionar con dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =============================================================================
  # DOLIBARR ERP (Real Dolibarr for staging)
  # =============================================================================
  dolibarr-db:
    image: mariadb:11
    container_name: transvega-dolibarr-db-staging
    environment:
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: ${DOLIBARR_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DOLIBARR_DB_ROOT_PASSWORD}
    volumes:
      - dolibarr-db-data-staging:/var/lib/mysql
    networks:
      - transvega-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "dolibarr", "-p${DOLIBARR_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  dolibarr:
    image: dolibarr/dolibarr:20
    container_name: transvega-dolibarr-staging
    environment:
      - DOLI_DB_HOST=dolibarr-db
      - DOLI_DB_NAME=dolibarr
      - DOLI_DB_USER=dolibarr
      - DOLI_DB_PASSWORD=${DOLIBARR_DB_PASSWORD}
      - WWW_HOME=/var/www/html
      - PHP_INI_MEMORY_LIMIT=256M
      - PHP_INI_MAX_EXECUTION_TIME=300
      - PHP_INI_UPLOAD_MAX_FILESIZE=20M
      - PHP_INI_POST_MAX_SIZE=20M
    volumes:
      - dolibarr-data-staging:/var/www/html
      - dolibarr-documents-staging:/var/www/documents
    ports:
      - "127.0.0.1:8013:80"
    depends_on:
      dolibarr-db:
        condition: service_healthy
    networks:
      - transvega-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || curl -sf http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # MOCK DOLIBARR (Staging usa mock para pruebas de integración)
  # =============================================================================
  mock-dolibarr:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mock-dolibarr
    image: ghcr.io/sanchezmo/transvega-animal/mock-dolibarr:${IMAGE_TAG:-latest}
    container_name: transvega-mock-dolibarr-staging
    environment:
      - ENVIRONMENT=staging
      - MOCK_DOLIBARR_API_KEY=mock-admin-key-123
      - MOCK_DOLIBARR_AGENT_KEY=mock-agent-key-456
      - MOCK_DOLIBARR_READONLY_KEY=mock-readonly-key-789
    ports:
      - "127.0.0.1:8011:8001"
    volumes:
      - ./tests/fixtures/dolibarr:/app/fixtures:ro
    networks:
      - transvega-backend
    restart: unless-stopped

  # =============================================================================
  # API INTEGRACIÓN (FastAPI - Acceso via Cloudflare Tunnel en staging)
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: ghcr.io/sanchezmo/transvega-animal/api:${IMAGE_TAG:-latest}
    container_name: transvega-api-staging
    environment:
      - ENVIRONMENT=staging
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=1
      # PostgreSQL auditoría - variables individuales (Settings no usa AUDIT_DB_URL)
      - AUDIT_DB_HOST=audit-db
      - AUDIT_DB_PORT=5432
      - AUDIT_DB_NAME=audit
      - AUDIT_DB_USER=audit
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD}
      # Redis - variables individuales (Settings no usa REDIS_URL)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Internal API URL for service-to-service communication
      - INTERNAL_API_URL=http://api:8000/api/v1
      # Dolibarr (REAL staging)
      - DOLIBARR_API_URL=http://dolibarr:80
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY}
      - DOLIBARR_TIMEOUT=30
      - MOCK_DOLIBARR_ENABLED=false
      # JWT & Cifrado
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=30
      - JWT_REFRESH_EXPIRATION_DAYS=7
      - FERNET_KEY=${FERNET_KEY}
      # API Keys por agente (requeridos para arrancar)
      - AGENT_API_KEY_SUPERVISOR=${AGENT_API_KEY_SUPERVISOR}
      - AGENT_API_KEY_PRODUCTS=${AGENT_API_KEY_PRODUCTS}
      - AGENT_API_KEY_COMPLIANCE=${AGENT_API_KEY_COMPLIANCE}
      - AGENT_API_KEY_PUBLISHING=${AGENT_API_KEY_PUBLISHING}
      - AGENT_API_KEY_SALES=${AGENT_API_KEY_SALES}
      - AGENT_API_KEY_INVOICING=${AGENT_API_KEY_INVOICING}
      - AGENT_API_KEY_PURCHASES=${AGENT_API_KEY_PURCHASES}
      - AGENT_API_KEY_BANKING=${AGENT_API_KEY_BANKING}
      - AGENT_API_KEY_ACCOUNTING=${AGENT_API_KEY_ACCOUNTING}
      - AGENT_API_KEY_TAX=${AGENT_API_KEY_TAX}
      - AGENT_API_KEY_MARKETING=${AGENT_API_KEY_MARKETING}
      - AGENT_API_KEY_TECHNICAL=${AGENT_API_KEY_TECHNICAL}
      - AGENT_API_KEY_DOG_INTAKE=${AGENT_API_KEY_DOG_INTAKE}
      - AGENT_API_KEY_EXPEDIENTES=${AGENT_API_KEY_EXPEDIENTES}
      - AGENT_API_KEY_FACTURACION=${AGENT_API_KEY_FACTURACION}
      # Aprobaciones
      - APPROVALS_SERVICE_URL=http://approvals:8000
      # Notificaciones
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET}
      # Telegram
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_WEBHOOK_SECRET_REQUIRED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_UPDATE_IDEMPOTENCY_TTL_HOURS=24
      # Ollama (Local LLM para facturas - LOCAL_ONLY)
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # NVIDIA (solo para tareas permitidas, NO para facturas)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      # Celery
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CELERY_TASK_SERIALIZER=json
      - CELERY_RESULT_SERIALIZER=json
      - CELERY_ACCEPT_CONTENT=["json"]
      - CELERY_TIMEZONE=Europe/Madrid
      - CELERY_TASK_TRACK_STARTED=true
      - CELERY_TASK_TIME_LIMIT=3600
      - CELERY_WORKER_PREFETCH_MULTIPLIER=4
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_TASK_DEFAULT_QUEUE=default
      # Rate limiting & Idempotencia
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - IDEMPOTENCY_TTL_HOURS=24
      - TELEGRAM_UPDATE_IDEMPOTENCY_TTL_HOURS=24
      # Cloudflare
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
      # Logs & Métricas
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      # Rate limiting interno
      - API_CORS_ORIGINS=["https://hermes.transvega-animal.es","http://localhost:3000","http://localhost:8002"]
    ports:
      - "127.0.0.1:8010:8000"  # Puerto local para debugging
    depends_on:
      audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dolibarr:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - transvega-backend
      - transvega-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # WORKER CELERY
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    image: ghcr.io/sanchezmo/transvega-animal/worker:${IMAGE_TAG:-latest}
    container_name: transvega-worker-staging
    environment:
      - ENVIRONMENT=staging
      # PostgreSQL auditoría
      - AUDIT_DB_HOST=audit-db
      - AUDIT_DB_PORT=5432
      - AUDIT_DB_NAME=audit
      - AUDIT_DB_USER=audit
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Dolibarr (REAL staging)
      - DOLIBARR_API_URL=http://dolibarr:80
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY}
      - DOLIBARR_TIMEOUT=30
      - MOCK_DOLIBARR_ENABLED=false
      # JWT & Cifrado
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=30
      - JWT_REFRESH_EXPIRATION_DAYS=7
      - FERNET_KEY=${FERNET_KEY}
      # Celery
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CELERY_TASK_SERIALIZER=json
      - CELERY_RESULT_SERIALIZER=json
      - CELERY_ACCEPT_CONTENT=["json"]
      - CELERY_TIMEZONE=Europe/Madrid
      - CELERY_TASK_TRACK_STARTED=true
      - CELERY_TASK_TIME_LIMIT=3600
      - CELERY_WORKER_PREFETCH_MULTIPLIER=4
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_TASK_DEFAULT_QUEUE=default
      # Internal API
      - INTERNAL_API_URL=http://api:8000/api/v1
      # API Keys
      - AGENT_API_KEY_SUPERVISOR=${AGENT_API_KEY_SUPERVISOR}
      - AGENT_API_KEY_PRODUCTS=${AGENT_API_KEY_PRODUCTS}
      - AGENT_API_KEY_COMPLIANCE=${AGENT_API_KEY_COMPLIANCE}
      - AGENT_API_KEY_PUBLISHING=${AGENT_API_KEY_PUBLISHING}
      - AGENT_API_KEY_SALES=${AGENT_API_KEY_SALES}
      - AGENT_API_KEY_INVOICING=${AGENT_API_KEY_INVOICING}
      - AGENT_API_KEY_PURCHASES=${AGENT_API_KEY_PURCHASES}
      - AGENT_API_KEY_BANKING=${AGENT_API_KEY_BANKING}
      - AGENT_API_KEY_ACCOUNTING=${AGENT_API_KEY_ACCOUNTING}
      - AGENT_API_KEY_TAX=${AGENT_API_KEY_TAX}
      - AGENT_API_KEY_MARKETING=${AGENT_API_KEY_MARKETING}
      - AGENT_API_KEY_TECHNICAL=${AGENT_API_KEY_TECHNICAL}
      - AGENT_API_KEY_DOG_INTAKE=${AGENT_API_KEY_DOG_INTAKE}
      - AGENT_API_KEY_EXPEDIENTES=${AGENT_API_KEY_EXPEDIENTES}
      - AGENT_API_KEY_FACTURACION=${AGENT_API_KEY_FACTURACION}
      # Aprobaciones
      - APPROVALS_SERVICE_URL=http://approvals:8000
      # Notificaciones
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET}
      # Telegram
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_WEBHOOK_SECRET_REQUIRED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_UPDATE_IDEMPOTENCY_TTL_HOURS=24
      # Ollama
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # NVIDIA (solo para tareas permitidas)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      # Cloudflare
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
      # Logs & Métricas
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      # Rate limiting & Idempotencia
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - IDEMPOTENCY_TTL_HOURS=24
    depends_on:
      redis:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      api:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # SERVICIO APROBACIONES
  # =============================================================================
  approvals:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.approvals
    image: ghcr.io/sanchezmo/transvega-animal/approvals:${IMAGE_TAG:-latest}
    container_name: transvega-approvals-staging
    environment:
      - ENVIRONMENT=staging
      - APPROVALS_PORT=8002
      # PostgreSQL auditoría
      - AUDIT_DB_HOST=audit-db
      - AUDIT_DB_PORT=5432
      - AUDIT_DB_NAME=audit
      - AUDIT_DB_USER=audit
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD}
      - APPROVALS_DB_URL=postgresql+asyncpg://audit:${AUDIT_DB_PASSWORD}@audit-db:5432/audit
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Notificaciones
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET}
      # Cloudflare
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "127.0.0.1:8012:8002"
    depends_on:
      audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transvega-backend
      - transvega-frontend
    restart: unless-stopped

  # =============================================================================
  # DASHBOARD INTERNO
  # =============================================================================
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    image: ghcr.io/sanchezmo/transvega-animal/dashboard:${IMAGE_TAG:-latest}
    container_name: transvega-dashboard-staging
    environment:
      - ENVIRONMENT=staging
      - DASHBOARD_PORT=3000
      - DASHBOARD_API_URL=http://api:8000
      - DASHBOARD_APPROVALS_URL=http://approvals:8002
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - api
      - approvals
    networks:
      - transvega-frontend
    restart: unless-stopped

  # =============================================================================
  # CLOUDFLARE TUNNEL (Staging)
  # =============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: transvega-cloudflared-staging
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_STAGING}
    networks:
      - transvega-frontend
      - transvega-backend
    restart: unless-stopped
    depends_on:
      - api
      - approvals
      - dashboard
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =============================================================================
  # OLLAMA (Modelos IA locales - LOCAL_ONLY para facturas)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: transvega-ollama-staging
    volumes:
      - ollama-data-staging:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
      - ./infrastructure/ollama/Modelfile:/app/infrastructure/ollama/Modelfile:ro
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-transvega-local}
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-qwen3.5:4b-q4_K_M}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=10
    entrypoint: ["/usr/local/bin/ollama-entrypoint.sh"]
    networks:
      - transvega-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

networks:
  transvega-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.1.0/24
  transvega-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.2.0/24
  transvega-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.3.0/24

volumes:
  audit-db-data-staging:
  redis-data-staging:
  prometheus-data-staging:
  grafana-data-staging:
  loki-data-staging:
  alertmanager-data-staging:
  ollama-data-staging:
  dolibarr-db-data-staging:
  dolibarr-data-staging:
  dolibarr-documents-staging: