# CI/CD Pipeline - Transvega Animal
# .github/workflows/ci-cd.yml

name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # LINT & TYPE CHECK
  # =============================================================================
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
          pip install -r services/integration-api/requirements.txt

      - name: Run Ruff (linting)
        run: |
          ruff check services/integration-api/app tests/
          ruff format --check services/integration-api/app tests/

      - name: Run MyPy (type checking)
        run: |
          mypy services/integration-api/app --strict

      - name: Run Bandit (security)
        run: |
          bandit -r services/integration-api/app -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # =============================================================================
  # UNIT TESTS
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/integration-api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx

      - name: Run unit tests
        env:
          AUDIT_DB_HOST: localhost
          AUDIT_DB_PORT: "5432"
          AUDIT_DB_NAME: audit_test
          AUDIT_DB_USER: audit
          AUDIT_DB_PASSWORD: test

          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""

          DOLIBARR_API_URL: http://mock-dolibarr:8001
          DOLIBARR_API_KEY: test-key

          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Rg=

          ENVIRONMENT: test
          MOCK_DOLIBARR_ENABLED: "true"

          PYTHONPATH: services/integration-api
        run: |
          pytest tests/unit -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit-tests

  # =============================================================================
  # INTEGRATION TESTS
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build mock-dolibarr image
        run: |
          docker build -t mock-dolibarr:test -f infrastructure/docker/Dockerfile.mock-dolibarr .

      - name: Start mock-dolibarr container
        run: |
          docker run -d --name mock-dolibarr -p 8001:8001 mock-dolibarr:test
          # Wait for health check
          for i in {1..30}; do
            if curl -sf http://localhost:8001/health >/dev/null; then
              echo "mock-dolibarr is ready"
              break
            fi
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/integration-api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run integration tests
        env:
          AUDIT_DB_HOST: localhost
          AUDIT_DB_PORT: "5432"
          AUDIT_DB_NAME: audit_test
          AUDIT_DB_USER: audit
          AUDIT_DB_PASSWORD: test

          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""

          DOLIBARR_API_URL: http://localhost:8001
          DOLIBARR_API_KEY: mock-dolibarr-key-12345

          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Rg=

          ENVIRONMENT: test
          MOCK_DOLIBARR_ENABLED: "true"

          PYTHONPATH: services/integration-api
        run: |
          pytest tests/integration -v --tb=short

      - name: Stop mock-dolibarr container
        if: always()
        run: docker stop mock-dolibarr && docker rm mock-dolibarr

  # =============================================================================
  # SECURITY SCANS
  # =============================================================================
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Run Trivy vulnerability scanner (Docker images)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/${{ github.repository }}/api:latest'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'

      - name: Check for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: master
          head: HEAD

  # =============================================================================
  # DOCKER BUILD & PUSH
  # =============================================================================
  docker-build:
    name: Build & Push Docker Images
    needs: [lint-and-type-check, unit-tests, integration-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        service: [api, worker, approvals, dashboard, mock-dolibarr]
        include:
          - service: api
            context: .
            dockerfile: infrastructure/docker/Dockerfile.api
          - service: worker
            context: .
            dockerfile: infrastructure/docker/Dockerfile.worker
          - service: approvals
            context: .
            dockerfile: infrastructure/docker/Dockerfile.approvals
          - service: dashboard
            context: .
            dockerfile: infrastructure/docker/Dockerfile.dashboard
          - service: mock-dolibarr
            context: .
            dockerfile: infrastructure/docker/Dockerfile.mock-dolibarr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # =============================================================================
  # DEPLOY STAGING
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/transvega
            git pull origin develop
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            sleep 30
            ./scripts/health-check.sh

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Staging deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # =============================================================================
  # DEPLOY PRODUCTION
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    needs: docker-build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/transvega
            git fetch origin
            git checkout ${{ github.event.release.tag_name || github.ref }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            sleep 30
            ./scripts/health-check.sh

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Production deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release (if tag)
        if: github.event_name == 'release'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          release_name: Release ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
          draft: false
          prerelease: false

  # =============================================================================
  # DEPENDENCY UPDATE
  # =============================================================================
  dependency-update:
    name: Dependency Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Update dependencies
        run: |
          pip-compile --upgrade services/integration-api/requirements.in
          pip-compile --upgrade services/approval-service/requirements.in
          pip-compile --upgrade services/task-queue/requirements.in

      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: weekly dependency updates'
          body: 'Automated weekly dependency updates'
          branch: dependency-updates
          delete-branch: true