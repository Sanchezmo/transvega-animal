version: '3.8'

services:
  # =============================================================================
  # BASE DE DATOS AUDITORÍA (PostgreSQL - Solo red interna)
  # =============================================================================
  audit-db:
    image: postgres:16-alpine
    container_name: transvega-audit-db
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-audit-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # NO exponer puertos - solo red interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # REDIS (Solo red interna)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: transvega-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    # NO exponer puertos - solo red interna
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # API INTEGRACIÓN (FastAPI - Solo red interna, acceso via Cloudflare Tunnel)
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: transvega-api
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AUDIT_DB_URL=postgresql+asyncpg://audit:${AUDIT_DB_PASSWORD}@audit-db:5432/audit
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DOLIBARR_API_URL=${DOLIBARR_API_URL}
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FERNET_KEY=${FERNET_KEY}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # NO exponer puertos - acceso via Cloudflare Tunnel
    volumes:
      - ./services/integration-api:/app:ro
      - ./adapters:/app/adapters:ro
      - ./shared:/app/shared:ro
    depends_on:
      audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transvega-backend
      - transvega-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # WORKER CELERY (Solo red interna)
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: transvega-worker
    environment:
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - AUDIT_DB_URL=postgresql+asyncpg://audit:${AUDIT_DB_PASSWORD}@audit-db:5432/audit
      - DOLIBARR_API_URL=${DOLIBARR_API_URL}
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./services/integration-api:/app:ro
      - ./adapters:/app/adapters:ro
      - ./shared:/app/shared:ro
      - ./agents:/app/agents:ro
      - ./services/task-queue:/app/tasks:ro
    depends_on:
      redis:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # =============================================================================
  # SERVICIO APROBACIONES (Solo red interna, acceso via Cloudflare Tunnel)
  # =============================================================================
  approvals:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.approvals
    container_name: transvega-approvals
    environment:
      - ENVIRONMENT=production
      - APPROVALS_PORT=8002
      - APPROVALS_DB_URL=postgresql+asyncpg://audit:${AUDIT_DB_PASSWORD}@audit-db:5432/audit
      - APPROVALS_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET}
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # NO exponer puertos - acceso via Cloudflare Tunnel
    volumes:
      - ./services/approval-service:/app:ro
    depends_on:
      audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transvega-backend
      - transvega-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # DASHBOARD INTERNO (Solo red interna, acceso via Cloudflare Tunnel)
  # =============================================================================
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: transvega-dashboard
    environment:
      - ENVIRONMENT=production
      - DASHBOARD_PORT=3000
      - DASHBOARD_API_URL=http://api:8000
      - DASHBOARD_APPROVALS_URL=http://approvals:8002
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # NO exponer puertos - acceso via Cloudflare Tunnel
    volumes:
      - ./services/dashboard:/app:ro
    depends_on:
      - api
      - approvals
    networks:
      - transvega-frontend
    restart: unless-stopped

  # =============================================================================
  # CLOUDFLARE TUNNEL (Único punto de entrada externo)
  # =============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: transvega-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - transvega-frontend
      - transvega-backend
    restart: unless-stopped
    depends_on:
      - api
      - approvals
      - dashboard
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =============================================================================
  # OLLAMA (Modelos IA locales - Solo red interna, recursos limitados)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: transvega-ollama
    volumes:
      - ollama-data:/root/.ollama
    # NO exponer puertos - solo red interna
    environment:
      - OLLAMA_MODELS=${OLLAMA_MODELS}
    networks:
      - transvega-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

networks:
  transvega-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  transvega-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
  transvega-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24

volumes:
  audit-db-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  ollama-data: