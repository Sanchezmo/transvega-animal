version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermespassword
      POSTGRES_DB: hermes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hermes_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - hermes_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hermes_net
    # No host port exposed; accessible only via internal network

  hermes:
    build: .
    container_name: hermes
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - hermes_net

networks:
  hermes_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_data: